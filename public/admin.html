<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SaveMyHistory — Админ-панель</title>
<style>
:root{--paper:#F7F1E7;--ink:#2A2018;--muted:#6E6152;--gold-d:#A67C32;--card:#fff;--line:#E3D8C5}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 80px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;margin:0}
.who{color:var(--muted);font-size:14px}
a.home{color:var(--gold-d);text-decoration:none;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .n{font-size:28px;font-weight:700}
.card .l{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.card.q .n{color:#A67C32}.card.proc .n{color:#2980b9}.card.done .n{color:#27ae60}.card.fail .n{color:#c0392b}.card.an .n{color:#8e5a2b}.card.ver .n{color:#6B5B95}.card.night .n{color:#3D6B8E}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 11px;text-align:left;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#F0E7D7;color:var(--muted);font-weight:600}
.thumb{width:46px;height:46px;border-radius:6px;object-fit:cover;background:#eee}
.thumbs{display:flex;gap:4px}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-spaces{background:#FBEFD6;color:#8e5a2b}.b-sql{background:#E4F6E9;color:#1e7a3f}.b-mixed{background:#E3F0FB;color:#2980b9}.wl-store{margin-left:8px;vertical-align:middle}
.b-queued{background:#FBEFD6;color:#A67C32}.b-uploaded{background:#FBEFD6;color:#A67C32}
.ops-note{display:none;margin:10px 0 0;padding:10px 12px;border-radius:10px;background:#FBEFD6;border:1px solid #E6D3A8;color:#6b5320;font-size:13px;line-height:1.4}
.ops-note.show{display:block}
.b-processing{background:#E3F0FB;color:#2980b9}.b-done{background:#E4F6E9;color:#27ae60}.b-failed{background:#FBE4E1;color:#c0392b}
.b-analyzed{background:#F3E8D8;color:#8e5a2b}
.act{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;margin-right:5px;min-height:32px}
.act:hover{background:#f5efe2}
.act.danger{border-color:#c0392b;color:#c0392b}
.gate{max-width:420px;margin:80px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 26px}
.gate h2{font-family:'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
.gate p{color:var(--muted)}
.btn{display:inline-block;margin-top:14px;background:var(--gold-d);color:#fff;border:none;border-radius:10px;padding:10px 20px;cursor:pointer;font-size:15px;text-decoration:none;min-height:40px}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.flt{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.flt button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;min-height:36px}
.flt button.on{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.muted{color:var(--muted);font-size:13px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px}
.scroll table{min-width:560px}
.invbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 24px}
.invbox h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;margin:0 0 10px}
.invbox .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.invbox input,.invbox select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;min-height:36px}
.invbox .btn{margin-top:0;padding:8px 14px;font-size:13px;border-radius:8px}
.invmsg{font-size:13px;min-height:18px;margin:6px 0}
.invmsg.ok{color:#27ae60}.invmsg.err{color:#c0392b}
.invmsg.list{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.45}
.code-cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@media (max-width:640px){
  h1{font-size:24px}
  .wrap{padding:16px 12px 60px}
  .card .n{font-size:22px}
  .act{margin-bottom:4px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate" style="display:none">
    <h2>Админ-панель</h2>
    <p id="gate-msg">Войдите аккаунтом администратора.</p>
    <a class="btn" id="login" href="#">Войти через Google</a>
  </div>

  <div id="panel" style="display:none">
    <div class="top">
      <h1>SaveMyHistory — Управление</h1>
      <div><span class="who" id="who"></span> · <a class="home" href="/">На сайт</a> · <a class="home" href="#" id="refresh">Обновить</a></div>
    </div>

    <div class="cards" id="cards"></div>
    <div class="ops-note" id="ops-note"></div>

    <div class="invbox" id="invbox">
      <h2>Инвайт-коды</h2>
      <div class="row">
        <label>Сколько <input id="inv-count" type="number" min="1" max="50" value="10" style="width:64px"></label>
        <label>Фото на код <input id="inv-credits" type="number" min="1" max="100" value="3" style="width:64px"></label>
        <label>Max uses <input id="inv-max" type="number" min="1" max="1000" value="1" style="width:64px"></label>
        <label>Note <input id="inv-note" type="text" value="friends-wave" placeholder="friends-wave" style="width:140px"></label>
        <button class="btn" id="inv-create" type="button">Создать</button>
        <button class="btn secondary" id="inv-copy-all" type="button">Копировать все</button>
        <button class="btn secondary" id="inv-export" type="button">Скачать CSV</button>
      </div>
      <div class="invmsg" id="inv-msg"></div>
      <div class="scroll">
        <table>
          <thead><tr><th>Код</th><th>Фото</th><th>Uses</th><th>Active</th><th>Note</th><th>Создан</th></tr></thead>
          <tbody id="inv-rows"><tr><td colspan="6" class="muted">—</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="invbox" id="wlbox">
      <h2>Лист ожидания <span class="muted" id="wl-count"></span> <span class="badge wl-store" id="wl-store" hidden></span></h2>
      <div class="row">
        <button class="btn secondary" id="wl-export" type="button">Скачать CSV</button>
        <button class="btn secondary" id="wl-refresh" type="button">Обновить список</button>
      </div>
      <div class="invmsg" id="wl-msg"></div>
      <div class="scroll">
        <table>
          <thead><tr><th>Email</th><th>Имя</th><th>Источник</th><th>Когда</th></tr></thead>
          <tbody id="wl-rows"><tr><td colspan="4" class="muted">—</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="flt" id="flt">
      <button data-s="" class="on">Все</button>
      <button data-s="queued">В очереди</button>
      <button data-s="processing">В работе</button>
      <button data-s="analyzed">Проанализировано</button>
      <button data-s="done">Готово</button>
      <button data-s="failed">Ошибки</button>
    </div>

    <div class="scroll">
      <table>
        <thead><tr><th>Фото</th><th>Режим</th><th>Статус</th><th>Создан</th><th>QC</th><th>Действия</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Загрузка…</td></tr></tbody>
      </table>
    </div>
    <p class="muted" id="foot" style="margin-top:14px"></p>
  </div>
</div>

<script>
const SB_URL='https://dvjpfabqkhtcjlqlvuhr.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2anBmYWJxa2h0Y2pscWx2dWhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTQ2NTEsImV4cCI6MjA5Njc3MDY1MX0.NvUzPTcaam386b_o_qtJMocvvfSmTfcB-tfxSYiQFRU';
const $=s=>document.querySelector(s);
let _token=null, curStatus='', _invites=[], _lastCreated=[], _waitlist=[], _wlStorage='';
function getToken(){ if(_token)return _token; try{_token=localStorage.getItem('smh_at')||null;}catch(e){} return _token; }
function setToken(t){ _token=t; try{ t?localStorage.setItem('smh_at',t):localStorage.removeItem('smh_at'); }catch(e){} }
function H(){ return {Authorization:'Bearer '+getToken()}; }

(function(){ const h=location.hash||''; const m=h.match(/access_token=([^&]+)/); if(m){ setToken(decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); } })();

async function login(){
  const sb=(await import('https://esm.sh/@supabase/supabase-js@2')).createClient(SB_URL,KEY,{auth:{detectSessionInUrl:false,flowType:'implicit',persistSession:false}});
  const {data}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/admin.html'}});
  if(data&&data.url) location.href=data.url;
}

function showGate(msg){ $('#gate').style.display='block'; $('#panel').style.display='none'; if(msg)$('#gate-msg').textContent=msg; }
function showPanel(){ $('#gate').style.display='none'; $('#panel').style.display='block'; }

async function copyText(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; }
  }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}

function modeLabel(m){
  if(m==='revive') return 'Готовый';
  if(m==='restore') return 'Подлинный';
  return m||'—';
}
function statusLabel(st){
  const map={queued:'в очереди',uploaded:'в очереди',processing:'в работе',processing_analyze:'анализ',analyzed:'проанализировано',generated:'сгенерировано',processing_verify:'проверка',needs_review:'на проверке',done:'готово',failed:'ошибка'};
  return map[st]||st||'';
}
function badgeClass(st){
  if(st==='uploaded'||st==='queued') return 'queued';
  if(st==='analyzed'||st==='generated'||st==='needs_review') return 'analyzed';
  if(st==='processing'||st==='processing_analyze'||st==='processing_verify') return 'processing';
  if(st==='done') return 'done';
  if(st==='failed') return 'failed';
  return 'queued';
}

async function init(){
  $('#login').onclick=e=>{e.preventDefault();login();};
  $('#refresh').onclick=e=>{e.preventDefault();loadAll();};
  const invBtn=$('#inv-create'); if(invBtn) invBtn.onclick=e=>{e.preventDefault();createInvites();};
  const invCopy=$('#inv-copy-all'); if(invCopy) invCopy.onclick=e=>{e.preventDefault();copyAllInvites();};
  const invExp=$('#inv-export'); if(invExp) invExp.onclick=e=>{e.preventDefault();exportInvitesCsv();};
  const wlExp=$('#wl-export'); if(wlExp) wlExp.onclick=e=>{e.preventDefault();exportWaitlistCsv();};
  const wlRef=$('#wl-refresh'); if(wlRef) wlRef.onclick=e=>{e.preventDefault();loadWaitlist();};
  $('#flt').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    curStatus=b.dataset.s; $('#flt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); loadRows();
  });
  if(!getToken()){ showGate(); return; }
  let r;
  try{ r=await fetch('/api/admin/check',{headers:H()}); }catch(e){ showGate('Ошибка сети.'); return; }
  if(r.status===403){ showGate('Этот аккаунт не админ. Войдите аккаунтом из белого списка.'); return; }
  if(r.status===401){ setToken(null); showGate('Сессия истекла. Войдите снова.'); return; }
  if(!r.ok){ showGate('Не удалось проверить доступ.'); return; }
  const me=await r.json(); $('#who').textContent=me.email||'';
  showPanel(); loadAll();
}

async function loadInvites(){
  const tb=$('#inv-rows'); if(!tb)return;
  try{
    const r=await fetch('/api/admin/invite-codes?limit=100',{headers:H()});
    if(!r.ok){ _invites=[]; tb.innerHTML='<tr><td colspan="6" class="muted">Не удалось загрузить коды ('+r.status+').</td></tr>'; return; }
    const j=await r.json(); const rows=j.codes||j||[];
    _invites=rows;
    if(!rows.length){ tb.innerHTML='<tr><td colspan="6" class="muted">Кодов пока нет — создайте выше.</td></tr>'; return; }
    syncOpsNote(rows);
  tb.innerHTML=rows.map(x=>{
      const code=x.code||'';
      return '<tr><td><div class="code-cell"><span class="code">'+code+'</span><button class="act" type="button" data-copy="'+code+'">Копировать</button></div></td><td>'+(x.free_restorations??'')+'</td><td>'+(x.used_count??0)+'/'+(x.max_uses??'')+'</td><td>'+(x.active?'да':'нет')+'</td><td class="muted">'+(x.note||'—')+'</td><td class="muted">'+fmt(x.created_at)+'</td></tr>';
    }).join('');
    tb.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{ const ok=await copyText(b.dataset.copy||''); b.textContent=ok?'Скопировано':'Ошибка'; setTimeout(()=>{b.textContent='Копировать';},1200); });
  }catch(e){ _invites=[]; tb.innerHTML='<tr><td colspan="6" class="muted">Ошибка сети.</td></tr>'; }
}

function inviteCodesForExport(){
  if(_lastCreated&&_lastCreated.length) return _lastCreated.slice();
  return (_invites||[]).map(x=>x.code).filter(Boolean);
}

async function copyAllInvites(){
  const msg=$('#inv-msg');
  const fromNew=_lastCreated&&_lastCreated.length;
  const codes=inviteCodesForExport();
  if(!codes.length){ msg.className='invmsg err'; msg.textContent='Нет кодов для копирования.'; return; }
  const ok=await copyText(codes.join('\n'));
  msg.className=ok?'invmsg ok list':'invmsg err';
  msg.textContent=ok
    ? ((fromNew?('Скопированы новые коды ('+codes.length+'):\n'):('Скопировано кодов: '+codes.length+'\n'))+codes.join('\n'))
    : 'Не удалось скопировать.';
}

function exportInvitesCsv(){
  const msg=$('#inv-msg');
  const fromNew=_lastCreated&&_lastCreated.length;
  const codes=inviteCodesForExport();
  if(!codes.length){ msg.className='invmsg err'; msg.textContent='Нечего экспортировать — сначала создайте коды.'; return; }
  const lines=['code'];
  codes.forEach(c=>lines.push(String(c)));
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(fromNew?'invite-new-':'invite-codes-')+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  msg.className='invmsg ok list';
  msg.textContent=(fromNew?('CSV новых кодов скачан ('+codes.length+'):\n'):('CSV скачан ('+codes.length+'):\n'))+codes.join('\n');
}

async function createInvites(){
  const msg=$('#inv-msg'); msg.className='invmsg'; msg.textContent='Создаю…';
  const body={
    count: parseInt(($('#inv-count').value||'10'),10)||10,
    free_restorations: parseInt(($('#inv-credits').value||'3'),10)||3,
    max_uses: parseInt(($('#inv-max').value||'1'),10)||1,
    note: ($('#inv-note').value||'').trim()
  };
  try{
    const r=await fetch('/api/admin/invite-codes',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},H()),body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ msg.className='invmsg err'; msg.textContent='Ошибка: '+(j.detail||r.status); return; }
    const created=j.created||[]; const n=created.length;
    const codes=created.map(x=>x.code).filter(Boolean);
    _lastCreated=codes.slice();
    let copied=false;
    if(codes.length) copied=await copyText(codes.join('\n'));
    msg.className='invmsg ok list';
    msg.textContent='Создано: '+n+(copied?' · скопированы в буфер':'')+(codes.length?('\n'+codes.join('\n')):'')+(codes.length?'\n\nМожно ещё: «Копировать все» или «Скачать CSV».':'');
    loadInvites();
  }catch(e){ msg.className='invmsg err'; msg.textContent='Ошибка сети'; }
}

async function loadWaitlist(){
  const tb=$('#wl-rows'); if(!tb)return;
  const msg=$('#wl-msg'); if(msg){ msg.className='invmsg'; msg.textContent='Загрузка…'; }
  try{
    const r=await fetch('/api/admin/waitlist?limit=500',{headers:H()});
    if(r.status===401||r.status===403){
      _waitlist=[]; _wlStorage='';
      if(msg){ msg.className='invmsg err'; msg.textContent='Нет доступа к waitlist ('+r.status+').'; }
      tb.innerHTML='<tr><td colspan="4" class="muted">Нет доступа.</td></tr>';
      return;
    }
    if(!r.ok){
      _waitlist=[]; _wlStorage='';
      if(msg){ msg.className='invmsg err'; msg.textContent='Не удалось загрузить ('+r.status+').'; }
      tb.innerHTML='<tr><td colspan="4" class="muted">Ошибка загрузки.</td></tr>';
      return;
    }
    const j=await r.json(); const rows=j.emails||[];
    _waitlist=rows; _wlStorage=j.storage||'';
    const c=$('#wl-count'); if(c) c.textContent='· '+(j.count??rows.length);
    const store=$('#wl-store');
    const st=String(j.storage||'');
    if(store){
      if(!st){ store.hidden=true; store.textContent=''; store.className='badge wl-store'; }
      else if(st==='spaces_fallback'){ store.hidden=false; store.textContent='Spaces fallback'; store.className='badge wl-store b-spaces'; store.title='Waitlist в Spaces (SQL-таблица ещё не создана)'; }
      else if(st==='supabase'||st==='sql'||st==='db'){ store.hidden=false; store.textContent='SQL'; store.className='badge wl-store b-sql'; store.title='Waitlist в SQL/DB'; }
      else if(st.includes('spaces')&&st.includes('supabase')){ store.hidden=false; store.textContent='SQL+Spaces'; store.className='badge wl-store b-mixed'; store.title='storage='+st; }
      else { store.hidden=false; store.textContent=st; store.className='badge wl-store b-mixed'; store.title='storage='+st; }
    }
    if(msg){
      msg.className='invmsg';
      msg.textContent=st==='spaces_fallback'
        ? 'Хранение: Spaces fallback (не SQL). Таблица waitlist в БД пока не создана — ops: смотри badge.'
        : (st==='supabase'||st==='sql'||st==='db'
          ? 'Хранение: SQL/DB (не Spaces fallback).'
          : (st?('Хранение: '+st):''));
    }
    if(!rows.length){ tb.innerHTML='<tr><td colspan="4" class="muted">Пока пусто — заявок в листе ожидания нет.</td></tr>'; return; }
    tb.innerHTML=rows.map(x=>'<tr><td class="code">'+(x.email||'')+'</td><td class="muted">'+(x.name||'—')+'</td><td class="muted">'+(x.source||x.storage||'—')+'</td><td class="muted">'+(typeof x.ts==='number'?fmt(new Date(x.ts*1000).toISOString()):fmt(x.ts))+'</td></tr>').join('');
  }catch(e){
    _waitlist=[];
    if(msg){ msg.className='invmsg err'; msg.textContent='Ошибка сети.'; }
    tb.innerHTML='<tr><td colspan="4" class="muted">Ошибка сети.</td></tr>';
  }
}

function exportWaitlistCsv(){
  const msg=$('#wl-msg');
  if(!_waitlist.length){ if(msg){ msg.className='invmsg err'; msg.textContent='Нечего экспортировать — список пуст.'; } return; }
  const esc=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?('"'+s.replace(/"/g,'""')+'"'):s; };
  const lines=['email,name,source,ts,storage'];
  _waitlist.forEach(x=>{
    const ts=typeof x.ts==='number'?new Date(x.ts*1000).toISOString():(x.ts||'');
    lines.push([esc(x.email),esc(x.name||''),esc(x.source||''),esc(ts),esc(x.storage||_wlStorage||'')].join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='waitlist-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  if(msg){ msg.className='invmsg ok'; msg.textContent='CSV скачан ('+_waitlist.length+' строк).'; }
}

async function loadAll(){ await Promise.all([loadStats(), loadRows(), loadInvites(), loadWaitlist()]); }

async function loadStats(){
  try{
    const r=await fetch('/api/admin/stats',{headers:H()}); if(!r.ok)return;
    const s=await r.json(); const q=s.queue||{}; const sum=s.summary||{};
    const inQueue=sum.queued!=null?sum.queued:((q.queued||0)+(q.uploaded||0));
    const analyzed=sum.analyzed!=null?sum.analyzed:(q.analyzed||0);
    const verified=sum.verified!=null?sum.verified:((q.generated||0)+(q.processing_verify||0)+(q.needs_review||0));
    const overnight=s.overnight_waiting!=null?s.overnight_waiting:(sum.overnight_waiting!=null?sum.overnight_waiting:analyzed);
    const inWork=(q.processing||0)+(q.processing_analyze||0)+(q.processing_verify||0);
    const cells=[
      ['q','В очереди',inQueue],
      ['an','Проанализировано',analyzed],
      ['night','Ждёт ночи',overnight],
      ['ver','На проверке',verified],
      ['proc','В работе',inWork],
      ['done','Готово',q.done||0],
      ['fail','Ошибки',q.failed||0],
      ['','Всего',s.total_restorations||0]
    ];
    $('#cards').innerHTML=cells.map(c=>'<div class="card '+c[0]+'"><div class="n">'+c[2]+'</div><div class="l">'+c[1]+'</div></div>').join('');
  }catch(e){}
}

function fmt(ts){ if(!ts)return''; try{ return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ts; } }
function qcBadge(qc){ if(!qc)return'<span class="muted">—</span>'; try{ const o=typeof qc==='string'?JSON.parse(qc):qc; const bad=['face_changed','extra_added','artifacts'].some(k=>o[k]); return bad?'<span class="badge b-failed">замечания</span>':'<span class="badge b-done">чисто</span>'; }catch(e){ return'<span class="muted">—</span>'; } }


function syncOpsNote(rows){
  const el=$('#ops-note');
  if(!el) return;
  const hit=(rows||[]).some(x=>{
    const err=String(x.error||'').toLowerCase();
    return err.includes('credit_backoff')||err.includes('analyze_err')||err.includes('insufficient_quota');
  });
  if(hit){
    el.textContent='Глаза на паузе (credit_backoff). Фото копятся в очереди — это не сбой загрузки. Друзьям в кабинете мягкий баннер «обычно к утру», без биллинга. Сброс: OpenAI «баланс ок» → воркер сам снимет backoff → queued уйдёт в analyzed. Не крутить GEN_* и не арендовать GPU «для глаз».';
  }else{
    el.textContent='';
  }
  el.classList.toggle('show', !!hit);
}
async function loadRows(){
  const tb=$('#rows'); tb.innerHTML='<tr><td colspan="6" class="muted">Загрузка…</td></tr>';
  let rows=[];
  try{ const u='/api/admin/restorations?limit=60'+(curStatus?('&status='+curStatus):''); const r=await fetch(u,{headers:H()}); if(r.ok)rows=await r.json(); else { tb.innerHTML='<tr><td colspan="6" class="muted">Не удалось загрузить заказы ('+r.status+').</td></tr>'; $('#foot').textContent=''; return; } }catch(e){ tb.innerHTML='<tr><td colspan="6" class="muted">Ошибка сети.</td></tr>'; $('#foot').textContent=''; return; }
  if(!rows.length){ tb.innerHTML='<tr><td colspan="6" class="muted">Нет заказов по этому фильтру.</td></tr>'; $('#foot').textContent=''; syncOpsNote([]); return; }
  syncOpsNote(rows);
  tb.innerHTML=rows.map(x=>{
    const st=x.status||'queued';
    const bs=badgeClass(st);
    const before=x.original_url?'<img class="thumb" src="'+x.original_url+'">':'';
    const after=x.result_url?'<img class="thumb" src="'+x.result_url+'">':'';
    const mode=modeLabel(x.mode);
    return '<tr>'
      +'<td><div class="thumbs">'+before+after+'</div></td>'
      +'<td>'+mode+'</td>'
      +'<td><span class="badge b-'+bs+'">'+statusLabel(st)+'</span></td>'
      +'<td class="muted">'+fmt(x.created_at)+'</td>'
      +'<td>'+qcBadge(x.qc)+'</td>'
      +'<td><button class="act" data-retry="'+x.id+'">Перезапуск</button><button class="act danger" data-del="'+x.id+'">Удалить</button></td>'
      +'</tr>';
  }).join('');
  $('#foot').textContent='Показано: '+rows.length;
  tb.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{ b.textContent='…'; try{ await fetch('/api/admin/restorations/'+b.dataset.retry+'/retry',{method:'POST',headers:H()}); loadAll(); }catch(e){} });
  tb.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Удалить этот заказ и файлы?'))return; b.textContent='…'; try{ await fetch('/api/admin/restorations/'+b.dataset.del,{method:'DELETE',headers:H()}); loadAll(); }catch(e){} });
}

init();
</script>
